[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "faultwatch"
version = "0.3.0"
description = "Shipboard machinery safety analytics: early fault detection, diagnosis, remaining life, safety-risk planning and an incident copilot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "shap>=0.44",
    "pulp>=2.7,<4",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "mlflow>=2.14",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.40",
    "altair>=5.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
boost = ["xgboost>=2.0", "catboost>=1.2"]
genai = ["rank-bm25>=0.2", "pypdf>=4.0", "openai>=1.40", "anthropic>=0.40",
         "sentence-transformers>=3.0"]
spark = ["pyspark>=3.5"]
dev = ["pytest>=7.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["faultwatch*", "pipelines*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning",
                  "ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "E741", "B023", "E402", "B905"]
