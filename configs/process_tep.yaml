# Process plant: Tennessee Eastman challenge process (reactor, separator, stripper, compressor)
name: process_tep
short_name: Tennessee Eastman process
description: Chemical process plant - 21 scripted process faults
dataset: tep
data_dir: data/tep
experiment: labeled_faults

regime_features: []              # one steady operating mode
sensors: [xmeas_1, xmeas_2, xmeas_3, xmeas_4, xmeas_5, xmeas_6, xmeas_7, xmeas_8, xmeas_9, xmeas_10,
          xmeas_11, xmeas_12, xmeas_13, xmeas_14, xmeas_15, xmeas_16, xmeas_17, xmeas_18, xmeas_19,
          xmeas_20, xmeas_21, xmeas_22, xmeas_23, xmeas_24, xmeas_25, xmeas_26, xmeas_27, xmeas_28,
          xmeas_29, xmeas_30, xmeas_31, xmeas_32, xmeas_33, xmeas_34, xmeas_35, xmeas_36, xmeas_37,
          xmeas_38, xmeas_39, xmeas_40, xmeas_41,
          xmv_1, xmv_2, xmv_3, xmv_4, xmv_5, xmv_6, xmv_7, xmv_8, xmv_9, xmv_10, xmv_11]
# 41 measurements (flows, pressures, temperatures, levels, analyzers) + 11 valve positions

healthy_label: normal
detector:
  method: mahalanobis
  quantile: 0.99
  persistence: 3            # 3 samples = 9 minutes
  calibration: blocked      # samples are autocorrelated: calibrate on held-out time blocks
seed: 42

# Classifier families compared by grouped CV. Each training run holds one fault, so
# folds are contiguous time blocks of every run (5 per run), not whole runs.
model_selection: {candidates: [gbm, xgb, catboost, logistic], folds: 5, time_blocks: 5, apply: false}

# Ship-level consequence (faultwatch/safety.py). Analog: fuel-treatment / process systems.
safety:
  system: process_plant
  redundancy: 1
  required: 1
  failure_modes:
    "*": {effect: process_upset, severity: 2, note: "process upset -> off-spec fuel, trip of consumers"}
